# Spring Boot Application Properties

server.port=8080

# Database Configuration (H2 In-Memory for Live Demo)
spring.datasource.url=jdbc:h2:mem:trustintern_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom Security Settings (JWT & Storage)
trustintern.jwt.secret=${TRUSTINTERN_JWT_SECRET:9a6140ba8651a2d64023c2c543f8e02d64023c2c543f8e02d64023c2c543f8e02d64023c2c543f8}
# 15 minutes access token
trustintern.jwt.expiration=900000
# 7 days refresh token
trustintern.jwt.refresh-expiration=604800000
# Token expiry windows
trustintern.token.email-verification.expiry-ms=86400000
trustintern.token.password-reset.expiry-ms=3600000
trustintern.upload.dir=uploads

# Python AI Service Integration
trustintern.ai.url=http://localhost:5000
